inherit_from: ../../.rubocop.yml

# Please specify only supported versions.
RBS/Layout:
  Enabled: true
  Include:
    - "7.2/**/*.rbs"
    - "8.0/**/*.rbs"
    - "8.1/**/*.rbs"
RBS/Lint:
  Enabled: true
  Include:
    - "7.2/**/*.rbs"
    - "8.0/**/*.rbs"
    - "8.1/**/*.rbs"
RBS/Style:
  Enabled: true
  Include:
    - "7.2/**/*.rbs"
    - "8.0/**/*.rbs"
    - "8.1/**/*.rbs"
